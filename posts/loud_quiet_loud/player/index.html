<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structure Player</title>
    <style>
        body {
            font-family: sans-serif;
            background: #222;
            color: #eee;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .meta {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        #waveform {
            width: 100%;
            height: 128px;
            background: #000;
            margin-bottom: 10px;
            position: relative;
        }

        .chroma-container {
            position: relative;
            width: 100%;
            height: 200px;
            background: #000;
            cursor: crosshair;
        }

        .chroma-img {
            width: 100%;
            height: 100%;
            display: block;
            user-select: none;
        }

        .cursor-overlay {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            left: 0;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .playback-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            background: #444;
            color: #fff;
            border: 1px solid #555;
            cursor: pointer;
            font-size: 1em;
            border-radius: 4px;
        }

        button:hover {
            background: #555;
        }

        select {
            padding: 10px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 16px;
            max-width: 400px;
        }

        /* Region Styles */
        .wavesurfer-region {
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            padding-left: 2px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="controls">
            <select id="trackSelect">
                <option disabled selected>Loading tracks...</option>
            </select>

            <button id="saveBtn" style="background: #2a9d8f;">💾 Save Breakpoints</button>

            <div class="playback-controls">
                <button id="playBtn">Play / Pause</button>
                <span id="timeDisplay">0:00 / 0:00</span>
            </div>
        </div>

        <!-- Breakpoint Controls -->
        <div id="breakpointControls"
            style="margin-bottom: 20px; padding: 10px; background: #333; border-radius: 4px; display: flex; align-items: center; gap: 10px;">
            <button id="addBreakpointBtn" style="background: #e9c46a; color: #333;">➕ Add Breakpoint (at
                cursor)</button>
            <button id="clearBreakpointsBtn" style="background: #e76f51;">🗑️ Clear All</button>
            <span style="color: #aaa; margin-left: 10px;">Click on a line to remove it.</span>
        </div>

        <h1 id="track-title">Select a Track</h1>
        <div class="meta" id="track-meta"></div>

        <!-- Waveform -->
        <div id="waveform"></div>

        <!-- Loudness -->
        <label>Loudness Dynamics</label>
        <div class="chroma-container" id="loudnessContainer">
            <img src="" class="chroma-img" id="loudnessImg" style="display:none">
            <div class="cursor-overlay" id="loudnessCursor"></div>
        </div>

        <!-- Chromagram -->
        <label>Structure & Harmony (Chromagram)</label>
        <div class="chroma-container" id="chromaContainer">
            <img src="" class="chroma-img" id="chromaImg" style="display:none">
            <div class="cursor-overlay" id="chromaCursor"></div>
        </div>
    </div>

    <script type="module">
        import WaveSurfer from 'https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.esm.js'
        import RegionsPlugin from 'https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.esm.js'

        let ws;
        let wsRegions;
        let currentDuration = 0;
        let activeRegion = null;
        let currentTrackId = null;

        const LABEL_COLORS = {
            'Intro': 'rgba(255, 255, 255, 0.2)', // Gray
            'Verse': 'rgba(0, 0, 255, 0.2)',    // Blue
            'Chorus': 'rgba(255, 0, 0, 0.2)',   // Red
            'Bridge': 'rgba(0, 255, 0, 0.2)',   // Green
            'Solo': 'rgba(255, 255, 0, 0.2)',   // Yellow
            'Outro': 'rgba(128, 0, 128, 0.2)',  // Purple
            'Silence': 'rgba(0, 0, 0, 0.5)',    // Black
            'Other': 'rgba(255, 165, 0, 0.2)'   // Orange
        };

        async function init() {
            // 1. Fetch Manifest
            try {
                const response = await fetch('manifest.json');
                const manifest = await response.json();

                const select = document.getElementById('trackSelect');
                select.innerHTML = '<option disabled selected>Select a Song...</option>';

                // Group by Artist
                const groups = {};
                manifest.forEach(track => {
                    if (!groups[track.artist]) groups[track.artist] = [];
                    groups[track.artist].push(track);
                });

                // Populate Select
                for (const [artist, tracks] of Object.entries(groups)) {
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = artist;
                    tracks.forEach(track => {
                        const opt = document.createElement('option');
                        opt.value = track.id;
                        opt.textContent = track.title;
                        optgroup.appendChild(opt);
                    });
                    select.appendChild(optgroup);
                }

                select.addEventListener('change', (e) => loadTrack(e.target.value));

                // Save Button Logic
                document.getElementById('saveBtn').addEventListener('click', saveGoldenData);

                // Breakpoint UI Logic
                document.getElementById('addBreakpointBtn').addEventListener('click', addBreakpoint);
                document.getElementById('clearBreakpointsBtn').addEventListener('click', clearBreakpoints);

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === ' ' && e.target.tagName !== 'SELECT' && e.target.tagName !== 'INPUT') {
                        e.preventDefault();
                        if (ws) ws.playPause();
                    }
                    // B key to add breakpoint
                    if (e.key === 'b' || e.key === 'B') {
                        addBreakpoint();
                    }
                });

                // Optional: Auto-load "Where Is My Mind" if present
                const pixiesTrack = manifest.find(t => t.title.includes("Where Is My Mind"));
                if (pixiesTrack) {
                    select.value = pixiesTrack.id;
                    loadTrack(pixiesTrack.id);
                }

            } catch (e) {
                console.error("Failed to load manifest:", e);
                document.getElementById('track-title').innerText = "Error loading manifest.json. Did you run the build script?";
            }
        }

        async function loadTrack(trackId) {
            currentTrackId = trackId;
            if (ws) ws.destroy();

            // Clear images
            document.getElementById('loudnessImg').style.display = 'none';
            document.getElementById('chromaImg').style.display = 'none';
            document.getElementById('track-title').innerText = "Loading...";

            const basePath = `tracks/${trackId}/`;

            try {
                const res = await fetch(basePath + 'data.json');
                const data = await res.json();
                currentDuration = data.duration;

                document.getElementById('track-title').innerText = `${data.filename.replace('.mp3', '')}`;
                document.getElementById('track-meta').innerText = `BPM: ${data.bpm.toFixed(1)} | Duration: ${data.duration.toFixed(1)}s`;

                // Load Images
                document.getElementById('loudnessImg').src = basePath + 'loudness.png';
                document.getElementById('loudnessImg').style.display = 'block';
                document.getElementById('chromaImg').src = basePath + 'chromagram.png';
                document.getElementById('chromaImg').style.display = 'block';

                // Init WaveSurfer
                ws = WaveSurfer.create({
                    container: '#waveform',
                    waveColor: '#4F4A85',
                    progressColor: '#383351',
                    url: basePath + data.audio_url,
                    height: 128,
                    barWidth: 2,
                    barGap: 1,
                    barRadius: 2,
                });

                wsRegions = ws.registerPlugin(RegionsPlugin.create())

                ws.on('ready', () => {
                    wsRegions.clearRegions();

                    // Load existing breakpoints
                    let points = [];
                    if (data.labeled_segments && data.labeled_segments.length > 0) {
                        data.labeled_segments.forEach(s => {
                            points.push(s.start);
                            points.push(s.end);
                        });
                    } else if (data.segments) {
                        points = data.segments;
                    }

                    points = [...new Set(points)].sort((a, b) => a - b)
                        .filter(t => t > 0.1 && t < currentDuration - 0.1);

                    points.forEach(t => createBreakpointMarker(t));
                });

                // Click on region (marker) to delete it
                wsRegions.on('region-clicked', (region, e) => {
                    e.stopPropagation();
                    region.remove();
                });

                // Playback
                const playBtn = document.getElementById('playBtn');
                playBtn.onclick = () => ws.playPause();
                ws.on('play', () => playBtn.innerText = "Pause");
                ws.on('pause', () => playBtn.innerText = "Play");

                ws.on('audioprocess', updateCursor);
                ws.on('seeking', updateCursor);
                ws.on('interaction', updateCursor);

            } catch (e) {
                console.error("Error loading track:", e);
                document.getElementById('track-title').innerText = "Error loading track data.";
            }
        }

        function updateCursor(time) {
            // In WS v7, time is passed, or use ws.getCurrentTime()
            if (typeof time !== 'number') time = ws.getCurrentTime();

            const chromaCursor = document.getElementById('chromaCursor');
            const loudnessCursor = document.getElementById('loudnessCursor');
            const timeDisplay = document.getElementById('timeDisplay');

            const pct = time / currentDuration;
            chromaCursor.style.left = `${pct * 100}%`;
            loudnessCursor.style.left = `${pct * 100}%`;

            const m = Math.floor(time / 60);
            const s = Math.floor(time % 60).toString().padStart(2, '0');
            timeDisplay.innerText = `${m}:${s} / ${Math.floor(currentDuration / 60)}:${Math.floor(currentDuration % 60).toString().padStart(2, '0')}`;
        }

        function createBreakpointMarker(time) {
            wsRegions.addRegion({
                start: time,
                end: time, // Zero duration -> Line
                color: 'rgba(255, 215, 0, 0.9)',
                drag: true,
                resize: false
            });
        }

        function addBreakpoint() {
            if (!ws) return;
            const t = ws.getCurrentTime();
            createBreakpointMarker(t);
        }

        function clearBreakpoints() {
            wsRegions.clearRegions();
        }

        function updateLabelUI() {
            // No-op
        }

        async function saveGoldenData() {
            if (!currentTrackId) return;
            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerText;
            btn.innerText = "Saving...";

            // valid breakpoints (sorted timestamps)
            const timestamps = wsRegions.getRegions()
                .map(r => r.start)
                .sort((a, b) => a - b);

            try {
                // Send timestamps directly in strict JSON
                const res = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        trackId: currentTrackId,
                        regions: timestamps
                    })
                });

                if (res.ok) {
                    btn.innerText = "✅ Saved!";
                    setTimeout(() => btn.innerText = originalText, 2000);
                } else {
                    btn.innerText = "❌ Error";
                    console.error(await res.text());
                }
            } catch (e) {
                console.error(e);
                btn.innerText = "❌ Error";
            }
        }

        // Click to Seek
        function seekFromClick(e, container) {
            if (!ws || !currentDuration) return;
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const pct = x / rect.width;
            const time = pct * currentDuration;
            ws.setTime(time);
        }

        document.getElementById('chromaContainer').addEventListener('click', (e) => seekFromClick(e, document.getElementById('chromaContainer')));
        document.getElementById('loudnessContainer').addEventListener('click', (e) => seekFromClick(e, document.getElementById('loudnessContainer')));

        init();
    </script>

</body>

</html>
